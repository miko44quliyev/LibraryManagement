spring.application.name=library-management
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
jwt.issuer=library-management
jwt.audience=library-client
jwt.access-secret=${JWT_ACCESS_SECRET:your-super-long-access-secret-key-123456789}
jwt.refresh-secret=${JWT_REFRESH_SECRET:your-super-long-refresh-secret-key-987654321}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:1209600}